[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["apps/synesthesia"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
url = "2.5"
synesthesia-core = { path = "crates/synesthesia-core" }
synesthesia-protocol = { path = "crates/synesthesia-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"
