[package]
name = "synesthesia-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
synesthesia-core.workspace = true
serde_json.workspace = true
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts", "accesskit"] }
ab_glyph = "=0.2.32"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
raw-window-handle = "=0.6.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
