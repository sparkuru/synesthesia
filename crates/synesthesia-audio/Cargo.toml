[package]
name = "synesthesia-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
synesthesia-core = { path = "../synesthesia-core" }
rubato = { version = "=0.16.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
